<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediCore — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="app-body">
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 12a4 4 0 0 1 8 0 4 4 0 0 1-8 0z"/>
            <path d="M3.5 12c2.5 2.5 6.5 2.5 9 0s6.5-2.5 8 0" opacity=".4"/>
          </svg>
        </span>
        <span class="brand-name">MediCore</span>
      </div>

      <nav class="nav">
        <a class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-view="patients">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.8-5 5.5-5s5.5 2 5.5 5"/><path d="M16 7.5a3 3 0 0 1 0 5.5M18 19c0-2-1-3.3-2.5-4.3"/></svg>
          <span>Patients</span>
        </a>
        <a class="nav-item" data-view="records">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 16h6"/></svg>
          <span>Records</span>
        </a>
        <a class="nav-item" data-view="messages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-4 3z"/></svg>
          <span>Messages</span>
        </a>
        <a class="nav-item" data-view="prescriptions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="8" height="8" rx="4"/><path d="m6 6 4 4"/><path d="M12 12l5 5a2.8 2.8 0 0 1-4 4l-5-5"/></svg>
          <span>Prescriptions</span>
        </a>
        <a class="nav-item" data-view="admin" id="navAdmin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>
          <span>Admin</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="lab-note">
          <strong>Security Lab</strong>
          <span>Intentionally vulnerable. Do not expose.</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuToggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
          <input id="globalSearch" type="text" placeholder="Search patients, MRN, diagnosis…" />
        </div>
        <div class="topbar-right">
          <button class="icon-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            <span class="badge-dot"></span>
          </button>
          <div class="user-chip" id="userChip">
            <span class="avatar" id="userAvatar">–</span>
            <div class="user-meta">
              <strong id="userName">—</strong>
              <span id="userRole">—</span>
            </div>
            <button class="icon-btn" id="logoutBtn" aria-label="Sign out" title="Sign out">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12H4M9 7l-5 5 5 5M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main class="content" id="content">
        <!-- views injected by app.js -->
        <div class="loading">Loading workspace…</div>
      </main>
    </div>
  </div>

  <!-- Patient detail drawer -->
  <div class="drawer-overlay" id="drawerOverlay" hidden></div>
  <aside class="drawer" id="patientDrawer" hidden aria-label="Patient detail"></aside>

  <script src="/js/app.js"></script>
</body>
</html>
